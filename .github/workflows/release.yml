name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Set release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tags must use the vMAJOR.MINOR.PATCH format."
          }
          Set-Content -Path version.py -Value "APP_VERSION = `"$version`"" -Encoding utf8NoBOM

      - name: Build standalone application
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name AlumetalManager app.py

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-Item "dist\AlumetalManager.exe"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist\SHA256SUMS.txt" -Value "$hash  AlumetalManager.exe" -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/AlumetalManager.exe
            dist/SHA256SUMS.txt
